services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: archsoft-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - net-db

  # Local Postgres backing Hospital-MP. Schema + seed are applied on first
  # boot via /docker-entrypoint-initdb.d (Postgres convention). Subsequent
  # restarts reuse the volume; drop the volume to re-seed.
  hospital-postgres:
    image: postgres:16-alpine
    container_name: archsoft-hospital-postgres
    environment:
      POSTGRES_DB: ${HOSPITAL_DB_NAME:-hospital}
      POSTGRES_USER: ${HOSPITAL_DB_USER:-hospital}
      POSTGRES_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital}
    expose:
      - "5432"
    volumes:
      - hospital-postgres-data:/var/lib/postgresql/data
      - ./Hospital-MP/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Hospital-MP/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOSPITAL_DB_USER:-hospital} -d ${HOSPITAL_DB_NAME:-hospital}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net-db

  # ---------------------------------------------------------------------------
  # Local Postgres for the Tenant service. Mirrors the Railway `tenant-postgres`
  # build at scripts/data-stores/tenant-postgres.Dockerfile: applies
  # Tenant/sql/init_schema.sql and scripts/data-stores/tenant-seed.sql exactly
  # once against an empty volume. Drop the volume to re-seed.
  # ---------------------------------------------------------------------------
  tenant-postgres:
    image: postgres:16-alpine
    container_name: archsoft-tenant-postgres
    environment:
      POSTGRES_DB: ${TENANT_DB_NAME:-tenant}
      POSTGRES_USER: ${TENANT_DB_USER:-tenant}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-tenant}
    expose:
      - "5432"
    volumes:
      # Schema is applied by the tenant-migrate service (golang-migrate);
      # Tenant main uses migrations, not a baked init script.
      - tenant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_DB_USER:-tenant} -d ${TENANT_DB_NAME:-tenant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net-db

  # One-shot: applies Tenant's global schema migrations to tenant-postgres
  # before the tenant service starts. Exits 0 when done.
  tenant-migrate:
    image: migrate/migrate:v4.18.1
    container_name: archsoft-tenant-migrate
    volumes:
      - ./Tenant/migrations/global:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${TENANT_DB_USER:-tenant}:${TENANT_DB_PASSWORD:-tenant}@tenant-postgres:5432/${TENANT_DB_NAME:-tenant}?sslmode=disable"
      - "up"
    depends_on:
      tenant-postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - net-db

  # Local Postgres backing Tenant. Global schema applied on first boot via
  # Tenant/migrations/global/*.up.sql files mounted into /docker-entrypoint-initdb.d
  # (Postgres convention). Per-tenant schemas are created at runtime via
  # provisionTenantSchema() when tenants are inserted via the API.
  # The 'tenant-seed' one-shot below populates a demo app_admin.
  tenant-postgres:
    image: postgres:16-alpine
    container_name: archsoft-tenant-postgres
    environment:
      POSTGRES_DB: ${TENANT_DB_NAME:-postgres}
      POSTGRES_USER: ${TENANT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-admin}
    expose:
      - "5432"
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
      - ./Tenant/migrations/global/000001_create_tenants.up.sql:/docker-entrypoint-initdb.d/01_tenants.sql:ro
      - ./Tenant/migrations/global/000002_create_users.up.sql:/docker-entrypoint-initdb.d/02_users.sql:ro
      - ./Tenant/migrations/global/000003_create_tool_registry.up.sql:/docker-entrypoint-initdb.d/03_tool_registry.sql:ro
      - ./scripts/data-stores/user-auth-init.sql:/docker-entrypoint-initdb.d/04_user_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_DB_USER:-postgres} -d ${TENANT_DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - archsoft

  # Local Mongo backing conversation-chat session+turn history.
  # Replaces the legacy Atlas MONGO_URI for self-contained local dev.
  conversation-mongo:
    image: mongo:7
    container_name: archsoft-conversation-mongo
    expose:
      - "27017"
    volumes:
      - conversation-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - archsoft

  # Local Mongo dedicated to the email audit service + compliance audit log.
  email-mongo:
    image: mongo:7
    container_name: archsoft-email-mongo
    expose:
      - "27017"
    volumes:
      - email-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - net-db

  # Message broker — RabbitMQ with management UI.
  # Built from UN_message_broker_mb which pre-declares chat_requests +
  # chat_results queues via definitions.json.
  rabbitmq:
    build:
      context: ./UN_message_broker_mb
    container_name: archsoft-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - net-db

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  tenant:
    build:
      context: ./Tenant
    container_name: archsoft-tenant
    environment:
      # DATABASE_URL defaults to the local tenant-postgres container so a
      # fresh `docker compose up` works without secrets. Override in .env
      # to point at Supabase or a managed Postgres.
      DATABASE_URL: ${DATABASE_URL:-postgres://${TENANT_DB_USER:-tenant}:${TENANT_DB_PASSWORD:-tenant}@tenant-postgres:5432/${TENANT_DB_NAME:-tenant}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GIN_MODE: release
      # Shared secret with the orchestrator for /api/v1/internal/* calls.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "8080:8080"
    depends_on:
      tenant-postgres:
        condition: service_healthy
      tenant-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - net-tenant
      - net-db

  # User-Auth — OTP-via-email microservice in front of Tenant's user CRUD.
  # FrontEnd /signup + Telegram pre-registration call it for code generation
  # and verification. Owns its own database (`user_auth`) on the shared
  # tenant-postgres instance.
  user-auth:
    build:
      context: ./User-Auth
    container_name: archsoft-user-auth
    environment:
      DB_URL: postgresql://postgres:admin@tenant-postgres:5432/user_auth?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_SERVICE_URL: http://email-send:8080/api/v1/emails
      AUTH_FROM_EMAIL: ${EMAIL_FROM_DEFAULT:-noreply@unagent.local}
      # Tenant exchange: after verify-code succeeds, User-Auth POSTs to
      # tenant's /internal/auth/upsert-from-otp with the shared key, and
      # forwards the canonical session JWT back to the caller.
      TENANT_INTERNAL_URL: http://tenant:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: "8080"
      GODEBUG: netdns=go
    ports:
      - "8093:8080"
    depends_on:
      tenant-postgres:
        condition: service_healthy
      email-send:
        condition: service_started
    networks:
      - archsoft

  # One-shot: seed an app_admin row after tenant-postgres applies its global schema.
  # Uses Tenant/cmd/seed/main.go (built into the same image). Idempotent — exits
  # cleanly if the admin already exists.
  tenant-seed:
    build:
      context: ./Tenant
    container_name: archsoft-tenant-seed
    command: ["/app/seed"]
    environment:
      DATABASE_URL: postgresql://postgres:admin@tenant-postgres:5432/postgres?sslmode=disable
      SEED_EMAIL: ${SEED_EMAIL:-admin@demo.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo1234}
      GODEBUG: netdns=go
    depends_on:
      tenant-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - archsoft

  hospital-mock:
    build:
      context: ./Hospital-MP
    container_name: archsoft-hospital-mock
    environment:
      DATABASE_URL: postgresql://${HOSPITAL_DB_USER:-hospital}:${HOSPITAL_DB_PASSWORD:-hospital}@hospital-postgres:5432/${HOSPITAL_DB_NAME:-hospital}
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "8092:8080"
    depends_on:
      hospital-postgres:
        condition: service_healthy
    networks:
      - net-orchestrator
      - net-db

  conversation-chat:
    build:
      context: ./conversation-chat
    container_name: archsoft-conversation-chat
    environment:
      SERVER_PORT: "8082"
      APP_VERSION: "1.0.0"
      GIN_MODE: release
      REDIS_URL: "redis://redis:6379/1"
      MONGO_URI: ${MONGO_URI:-mongodb://conversation-mongo:27017}
      MONGO_DB: ${MONGO_DB:-conversatory}
      ACR_SERVICE_URL: "http://agent-runtime:3100"
      TENANT_SERVICE_URL: "http://agent-runtime:3100"
      AUTH_SERVICE_URL: "http://tenant:8080"
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      AUTH_STUB: "true"
      AUTH_STUB_USER_ID: "00000000-0000-0000-0000-000000000001"
      AUTH_STUB_ROLE: "app_admin"
      AUTH_STUB_EMAIL: "internal@platform.local"
      DEFAULT_IDLE_TIMEOUT_SECONDS: "300"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      conversation-mongo:
        condition: service_healthy
      agent-runtime:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      conversation-mongo:
        condition: service_healthy
    networks:
      - net-orchestrator
      - net-db

  # Local MongoDB for conversation-chat sessions + history. Replaces the
  # Atlas dependency for local testing (same role as conversation-mongo
  # on Railway). Drop the conversation-mongo-data volume to re-seed.
  conversation-mongo:
    image: mongo:7
    container_name: archsoft-conversation-mongo
    expose:
      - "27017"
    volumes:
      - conversation-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - net-orchestrator
      - net-db
      - net-tenant

  agent-runtime:
    build:
      context: ./agent-runtime
    container_name: archsoft-agent-runtime
    environment:
      PORT: "3100"
      CONVERSATION_CHAT_URL: "http://conversation-chat:8082"
      HOSPITAL_MOCK_URL: "http://hospital-mock:8080"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "3100:3100"
    depends_on:
      hospital-mock:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - net-orchestrator
      - net-db

  chat-orch:
    build:
      context: ./chat-orch
    container_name: archsoft-chat-orch
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      CONVERSATION_CHAT_URL: "http://conversation-chat:8082"
      TENANT_SERVICE_URL: "http://tenant:8080"
      METRICAS_URL: "http://compliance:8091"
      HOSPITAL_MOCK_URL: "http://hospital-mock:8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_TENANT_ID: ${TELEGRAM_DEFAULT_TENANT_ID:-demo-tenant}
      TELEGRAM_DEFAULT_TENANT_SLUG: ${TELEGRAM_DEFAULT_TENANT_SLUG:-demo-hospital}
      # When USER_AUTH_URL is set, every Telegram message is gated by the
      # OTP pre-registration flow before reaching the LLM. Leave unset to
      # disable the gate (legacy behavior).
      USER_AUTH_URL: ${USER_AUTH_URL:-http://user-auth:8080}
      # Twilio voice channel (P2-P3, not yet wired). Leave empty to disable.
      # Account SID + Auth Token are sufficient for the REST API; API Key
      # SID/Secret are required to sign Access Tokens for client SDKs.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_DEFAULT_TENANT_ID: ${TWILIO_DEFAULT_TENANT_ID:-demo-tenant}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      AGENT_RUNTIME_URL: "http://agent-runtime:3100"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
      RATE_LIMIT_CHAT_BURST: ${RATE_LIMIT_CHAT_BURST:-20}
      RATE_LIMIT_CHAT_PER_SEC: ${RATE_LIMIT_CHAT_PER_SEC:-1.0}
      RATE_LIMIT_FEEDBACK_BURST: ${RATE_LIMIT_FEEDBACK_BURST:-10}
      RATE_LIMIT_FEEDBACK_PER_SEC: ${RATE_LIMIT_FEEDBACK_PER_SEC:-0.5}
      RUST_LOG: "chat_orch=info,tower_http=info"
      LOG_FORMAT: "json"
    ports:
      - "8000:3000"
    depends_on:
      - agent-runtime
      - conversation-chat
      - hospital-mock
    networks:
      - net-orchestrator
      - net-tenant
      - net-compliance

  frontend:
    build:
      context: ./FrontEnd
      args:
        # Vite inlines these at build time. The frontend nginx now reverse-
        # proxies every API path back to the right backend (see
        # FrontEnd/nginx.conf), so the browser stays on a single origin and
        # the bundle uses relative URLs by default. Override here only for
        # builds that need to hit non-same-origin backends (staging without
        # the gateway, LAN demos pointing the bundle at a separate API host).
        VITE_TENANT_API_URL: ${VITE_TENANT_API_URL-}
        VITE_ORCH_API_URL: ${VITE_ORCH_API_URL-}
        VITE_METRICAS_API_URL: ${VITE_METRICAS_API_URL-}
        VITE_CHAT_API_URL: ${VITE_CHAT_API_URL:-/api/v1}
    container_name: archsoft-frontend
    ports:
      # The Next.js standalone server listens on 3000 (was nginx :80).
      - "3000:3000"
    depends_on:
      tenant:
        condition: service_healthy
      conversation-chat:
        condition: service_started
      chat-orch:
        condition: service_started
      compliance:
        condition: service_healthy
    networks:
      - net-public
      - net-tenant
      - net-compliance

  # ---------------------------------------------------------------------------
  # Compliance & Metrics API (Python/FastAPI) — back-compat for the old
  # Metricas wire contract (/conversation/chat, /feedback/csat, /stats/kpis,
  # /stats/timeseries) plus new audit endpoints (/v1/event, /v1/feedback).
  # Audit log is persisted to the local email-mongo container by default;
  # override MONGO_URI_COMPLIANCE in the umbrella .env to point elsewhere.
  # ---------------------------------------------------------------------------
  compliance:
    build:
      context: ./Compliance
    container_name: archsoft-compliance
    ports:
      - "8091:8091"
    environment:
      MONGO_URI: ${MONGO_URI_COMPLIANCE:-mongodb://email-mongo:27017}
      MONGO_DB_COMPLIANCE: ${MONGO_DB_COMPLIANCE:-UN_compliance_db}
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/health', timeout=2).status == 200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      email-mongo:
        condition: service_healthy
    networks:
      - net-compliance
      - net-db

  # ---------------------------------------------------------------------------
  # Email dispatch + audit trail (Java/Spring Boot, SendGrid + local Mongo).
  # ---------------------------------------------------------------------------
  email-send:
    build:
      context: ./UN_email_send_ms
    container_name: archsoft-email-send
    environment:
      SERVER_PORT: "8080"
      MONGO_URI: "mongodb://email-mongo:27017"
      MONGO_DB_EMAIL: ${MONGO_DB_EMAIL:-email_audit}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_SANDBOX_MODE: ${SENDGRID_SANDBOX_MODE:-true}
      EMAIL_FROM_DEFAULT: ${EMAIL_FROM_DEFAULT:-noreply@unagent.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-UNAgent Notifications}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_STUB: ${EMAIL_AUTH_STUB:-true}
      AUTH_STUB_USER_ID: "00000000-0000-0000-0000-000000000001"
      AUTH_STUB_ROLE: "app_admin"
      AUTH_STUB_EMAIL: "internal@platform.local"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
      LOG_FORMAT: "json"
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      email-mongo:
        condition: service_healthy
    networks:
      - net-compliance
      - net-db

  # ---------------------------------------------------------------------------
  # Grafana — observability dashboards. Empty out of the box; configure
  # data sources via the UI (Compliance JSON via the Infinity plugin,
  # RabbitMQ exporter at :15692, etc.). Persistent state in the
  # `grafana-data` named volume.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: archsoft-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - net-public
      - net-compliance

networks:
  net-public:
    driver: bridge
  net-orchestrator:
    driver: bridge
  net-tenant:
    driver: bridge
  net-compliance:
    driver: bridge
  net-db:
    driver: bridge

volumes:
  email-mongo-data:
  conversation-mongo-data:
  hospital-postgres-data:
  tenant-postgres-data:
  grafana-data:
