services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: archsoft-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chat_db_net

  # Local Postgres backing Hospital-MP. Schema + seed are applied on first
  # boot via /docker-entrypoint-initdb.d (Postgres convention). Subsequent
  # restarts reuse the volume; drop the volume to re-seed.
  hospital-postgres:
    image: postgres:16-alpine
    container_name: archsoft-hospital-postgres
    environment:
      POSTGRES_DB: ${HOSPITAL_DB_NAME:-hospital}
      POSTGRES_USER: ${HOSPITAL_DB_USER:-hospital}
      POSTGRES_PASSWORD: ${HOSPITAL_DB_PASSWORD:-hospital}
    expose:
      - "5432"
    volumes:
      - hospital-postgres-data:/var/lib/postgresql/data
      - ./Hospital-MP/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Hospital-MP/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOSPITAL_DB_USER:-hospital} -d ${HOSPITAL_DB_NAME:-hospital}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hospital_db_net

  # Local Postgres for the Tenant service. Schema is applied via tenant-migrate
  # (golang-migrate) before the tenant service starts.
  tenant-postgres:
    image: postgres:16-alpine
    container_name: archsoft-tenant-postgres
    environment:
      POSTGRES_DB: ${TENANT_DB_NAME:-tenant}
      POSTGRES_USER: ${TENANT_DB_USER:-tenant}
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-tenant}
    expose:
      - "5432"
    volumes:
      - tenant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_DB_USER:-tenant} -d ${TENANT_DB_NAME:-tenant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tenant_db_net

  # One-shot: applies Tenant's global schema migrations before the tenant
  # service starts. Exits 0 when done.
  tenant-migrate:
    image: migrate/migrate:v4.18.1
    container_name: archsoft-tenant-migrate
    volumes:
      - ./Tenant/migrations/global:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${TENANT_DB_USER:-tenant}:${TENANT_DB_PASSWORD:-tenant}@tenant-postgres:5432/${TENANT_DB_NAME:-tenant}?sslmode=disable"
      - "up"
    depends_on:
      tenant-postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - tenant_db_net

  # Local Mongo dedicated to the email audit service.
  email-mongo:
    image: mongo:7
    container_name: archsoft-email-mongo
    expose:
      - "27017"
    volumes:
      - email-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - email_net
      - compliance_db_net

  # Local MongoDB for conversation-chat sessions + history.
  conversation-mongo:
    image: mongo:7
    container_name: archsoft-conversation-mongo
    expose:
      - "27017"
    volumes:
      - conversation-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chat_db_net

  # Message broker — RabbitMQ with management UI.
  rabbitmq:
    build:
      context: ./UN_message_broker_mb
    container_name: archsoft-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - orch_net

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  tenant:
    build:
      context: ./Tenant
    container_name: archsoft-tenant
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${TENANT_DB_USER:-tenant}:${TENANT_DB_PASSWORD:-tenant}@tenant-postgres:5432/${TENANT_DB_NAME:-tenant}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET}
      GIN_MODE: release
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    ports:
      - "8080:8080"
    depends_on:
      tenant-postgres:
        condition: service_healthy
      tenant-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orch_net
      - tenant_net
      - tenant_db_net

  hospital-mock:
    build:
      context: ./Hospital-MP
    container_name: archsoft-hospital-mock
    environment:
      DATABASE_URL: postgresql://${HOSPITAL_DB_USER:-hospital}:${HOSPITAL_DB_PASSWORD:-hospital}@hospital-postgres:5432/${HOSPITAL_DB_NAME:-hospital}
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "8092:8080"
    depends_on:
      hospital-postgres:
        condition: service_healthy
    networks:
      - orch_net
      - hospital_db_net

  conversation-chat:
    build:
      context: ./conversation-chat
    container_name: archsoft-conversation-chat
    environment:
      SERVER_PORT: "8082"
      APP_VERSION: "1.0.0"
      GIN_MODE: release
      REDIS_URL: "redis://redis:6379/1"
      MONGO_URI: ${MONGO_URI:-mongodb://conversation-mongo:27017}
      MONGO_DB: ${MONGO_DB:-conversatory}
      ACR_SERVICE_URL: "http://agent-runtime:3100"
      TENANT_SERVICE_URL: "http://agent-runtime:3100"
      AUTH_SERVICE_URL: "http://tenant:8080"
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      AUTH_STUB: "true"
      AUTH_STUB_USER_ID: "00000000-0000-0000-0000-000000000001"
      AUTH_STUB_ROLE: "app_admin"
      AUTH_STUB_EMAIL: "internal@platform.local"
      DEFAULT_IDLE_TIMEOUT_SECONDS: "300"
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      agent-runtime:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      conversation-mongo:
        condition: service_healthy
    networks:
      - orch_net
      - chat_db_net

  agent-runtime:
    build:
      context: ./agent-runtime
    container_name: archsoft-agent-runtime
    environment:
      PORT: "3100"
      CONVERSATION_CHAT_URL: "http://conversation-chat:8082"
      HOSPITAL_MOCK_URL: "http://hospital-mock:8080"
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      RABBITMQ_URL: "amqp://rabbitmq:5672"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    ports:
      - "3100:3100"
    depends_on:
      hospital-mock:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - orch_net

  chat-orch:
    build:
      context: ./chat-orch
    container_name: archsoft-chat-orch
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "3000"
      CONVERSATION_CHAT_URL: "http://conversation-chat:8082"
      TENANT_SERVICE_URL: "http://tenant:8080"
      METRICAS_URL: "http://compliance:8091"
      HOSPITAL_MOCK_URL: "http://hospital-mock:8080"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_TENANT_ID: ${TELEGRAM_DEFAULT_TENANT_ID:-demo-tenant}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_TWIML_APP_SID: ${TWILIO_TWIML_APP_SID:-}
      TWILIO_DEFAULT_TENANT_ID: ${TWILIO_DEFAULT_TENANT_ID:-demo-tenant}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      AGENT_RUNTIME_URL: "http://agent-runtime:3100"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
      RATE_LIMIT_CHAT_BURST: ${RATE_LIMIT_CHAT_BURST:-20}
      RATE_LIMIT_CHAT_PER_SEC: ${RATE_LIMIT_CHAT_PER_SEC:-1.0}
      RATE_LIMIT_FEEDBACK_BURST: ${RATE_LIMIT_FEEDBACK_BURST:-10}
      RATE_LIMIT_FEEDBACK_PER_SEC: ${RATE_LIMIT_FEEDBACK_PER_SEC:-0.5}
      RUST_LOG: "chat_orch=info,tower_http=info"
      LOG_FORMAT: "json"
    ports:
      - "8000:3000"
    depends_on:
      - agent-runtime
      - conversation-chat
      - hospital-mock
    networks:
      - public_net
      - orch_net
      - compliance_net

  frontend:
    build:
      context: ./FrontEnd
      args:
        VITE_TENANT_API_URL: ${VITE_TENANT_API_URL-}
        VITE_ORCH_API_URL: ${VITE_ORCH_API_URL-}
        VITE_METRICAS_API_URL: ${VITE_METRICAS_API_URL-}
        VITE_CHAT_API_URL: ${VITE_CHAT_API_URL:-/api/v1}
    container_name: archsoft-frontend
    ports:
      - "3000:3000"
    depends_on:
      tenant:
        condition: service_healthy
      conversation-chat:
        condition: service_started
      chat-orch:
        condition: service_started
      compliance:
        condition: service_healthy
    networks:
      - public_net
      - orch_net
      - tenant_net
      - compliance_net

  # ---------------------------------------------------------------------------
  # Compliance & Metrics API (Python/FastAPI)
  # ---------------------------------------------------------------------------
  compliance:
    build:
      context: ./Compliance
    container_name: archsoft-compliance
    ports:
      - "8091:8091"
    environment:
      MONGO_URI: ${MONGO_URI_COMPLIANCE:-mongodb://email-mongo:27017}
      MONGO_DB_COMPLIANCE: ${MONGO_DB_COMPLIANCE:-UN_compliance_db}
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/health', timeout=2).status == 200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      email-mongo:
        condition: service_healthy
    networks:
      - compliance_net
      - compliance_db_net

  # ---------------------------------------------------------------------------
  # Email dispatch + audit trail (Java/Spring Boot, SendGrid + local Mongo).
  # ---------------------------------------------------------------------------
  email-send:
    build:
      context: ./UN_email_send_ms
    container_name: archsoft-email-send
    environment:
      SERVER_PORT: "8080"
      MONGO_URI: "mongodb://email-mongo:27017"
      MONGO_DB_EMAIL: ${MONGO_DB_EMAIL:-email_audit}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_SANDBOX_MODE: ${SENDGRID_SANDBOX_MODE:-true}
      EMAIL_FROM_DEFAULT: ${EMAIL_FROM_DEFAULT:-noreply@unagent.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-UNAgent Notifications}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_STUB: ${EMAIL_AUTH_STUB:-true}
      AUTH_STUB_USER_ID: "00000000-0000-0000-0000-000000000001"
      AUTH_STUB_ROLE: "app_admin"
      AUTH_STUB_EMAIL: "internal@platform.local"
      BACKEND_CHANNEL_KEY: ${BACKEND_CHANNEL_KEY:-}
      BACKEND_CHANNEL_ENABLED: ${BACKEND_CHANNEL_ENABLED:-false}
      LOG_FORMAT: "json"
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      email-mongo:
        condition: service_healthy
    networks:
      - email_net
      - tenant_net

  # ---------------------------------------------------------------------------
  # Grafana — observability dashboards.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: archsoft-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - public_net
      - compliance_net

networks:
  # Public zone — receives external traffic
  public_net:
    driver: bridge
  # Orchestration sub-zone — main chat flow
  orch_net:
    driver: bridge
  # Tenant support zone — source of truth for auth/tenants
  tenant_net:
    driver: bridge
  # Audit and traceability zone
  compliance_net:
    driver: bridge
  # Authentication sub-zone
  auth_net:
    driver: bridge
  # Email service zone
  email_net:
    driver: bridge
  # Exclusive networks per service <-> DB pair (least privilege)
  tenant_db_net:
    driver: bridge
  chat_db_net:
    driver: bridge
  hospital_db_net:
    driver: bridge
  compliance_db_net:
    driver: bridge
  auth_db_net:
    driver: bridge

volumes:
  email-mongo-data:
  conversation-mongo-data:
  hospital-postgres-data:
  tenant-postgres-data:
  grafana-data:
