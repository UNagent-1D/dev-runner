# golang-migrate "up" against tenant-postgres. Migrations are mounted from the
# tenant-migrate-migrations ConfigMap (generated from Tenant/migrations/global/*).
# Must complete before tenant-seed and the tenant Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-migrate
  labels: { app: tenant-migrate }
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app: tenant-migrate }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h tenant-postgres -U tenant -d tenant; do echo waiting for tenant-postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.1
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: DATABASE_URL_TENANT }
          volumeMounts:
            - { name: migrations, mountPath: /migrations, readOnly: true }
      volumes:
        - name: migrations
          configMap: { name: tenant-migrate-migrations }
