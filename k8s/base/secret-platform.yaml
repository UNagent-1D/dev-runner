apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  labels:
    app.kubernetes.io/part-of: unagent
type: Opaque
# NOTE: these are LOCAL-DEV defaults (identical to docker-compose.yml / .env.example
# defaults) so `kubectl apply -k k8s/` boots a working cluster out of the box.
# The only value you MUST replace for live LLM responses is OPENROUTER_API_KEY.
# Override at deploy time without editing this file, e.g.:
#   kubectl create secret generic platform-secrets -n unagent \
#     --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
stringData:
  # --- LLM provider: REPLACE with a real key for live chat ---
  OPENROUTER_API_KEY: "sk-or-v1-REPLACE_ME"

  # --- Shared app secrets ---
  JWT_SECRET: "dev-jwt-secret-change-me-please-32bytes-min"
  INTERNAL_API_KEY: "dev-internal-key"
  BACKEND_CHANNEL_KEY: ""

  # --- Email (SendGrid sandbox: value unused but must be non-empty) ---
  SENDGRID_API_KEY: "SG.sandbox-placeholder"

  # --- Datastore credentials (local defaults) ---
  POSTGRES_PASSWORD_TENANT: "tenant"
  POSTGRES_PASSWORD_HOSPITAL: "hospital"
  GRAFANA_ADMIN_PASSWORD: "admin"
  SEED_PASSWORD: "demo1234"

  # --- Full DB connection strings (carry the password) ---
  DATABASE_URL_TENANT: "postgres://tenant:tenant@tenant-postgres:5432/tenant?sslmode=disable"
  DATABASE_URL_USER_AUTH: "postgresql://tenant:tenant@tenant-postgres:5432/user_auth?sslmode=disable"
  DATABASE_URL_HOSPITAL: "postgresql://hospital:hospital@hospital-postgres:5432/hospital"
