# Auth + tenant admin API (Go/Gin). Waits for the migrated schema before serving.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant
  labels: { app: tenant }
spec:
  # 2 replicas for HA. Stateless except the in-memory login rate-limit buckets
  # (middlewares/rate_limit_middleware.go): with N pods each keeps its own
  # bucket, so the effective per-client login budget is ~N× the configured one.
  # Acceptable dilution — the throttle still bounds abuse; tighten the
  # per-pod rate if N grows.
  replicas: 2
  selector:
    matchLabels: { app: tenant }
  template:
    metadata:
      # net-* labels mirror docker-compose networks (see network/networkpolicies.yaml)
      labels: { app: tenant, net-orch: "true", net-tenant: "true", net-tenant-db: "true" }
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until psql "$DATABASE_URL" -tAc "SELECT 1 FROM schema_migrations WHERE version >= 4 AND NOT dirty" 2>/dev/null | grep -qx 1; do
                echo waiting for migrated tenant schema; sleep 2;
              done
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DATABASE_URL_TENANT } }
      containers:
        - name: tenant
          image: unagent/tenant:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DATABASE_URL_TENANT } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: platform-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: INTERNAL_API_KEY } }
            - name: GIN_MODE
              valueFrom: { configMapKeyRef: { name: platform-config, key: GIN_MODE } }
            # Behind Cloudflare + GCLB + nginx, the real client IP arrives in
            # forwarded headers. Trust them so the login rate limiter keys per
            # user, not per (shared) nginx pod IP. (pentest H1)
            - { name: TRUST_PROXY_HEADERS, value: "true" }
            # CORS allow-list (pentest C1 — never "*" with credentials). Both
            # origins; the actual browser path is same-origin via the Worker.
            - { name: CORS_ALLOW_ORIGINS, value: "https://unagent.site https://dev.unagent.site" }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tenant
  labels: { app: tenant }
spec:
  selector: { app: tenant }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
