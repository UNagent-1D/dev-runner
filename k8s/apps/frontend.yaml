# Public entry — nginx serving the static SPA export AND reverse-proxying API
# paths to backend Services (single-origin). Exposed via type: LoadBalancer
# (needs `minikube tunnel`). Image fixed in the FrontEnd submodule (static
# export + k8s-aware nginx resolver).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      # net-* labels mirror docker-compose networks (see network/networkpolicies.yaml)
      labels: { app: frontend, net-public: "true", net-orch: "true", net-tenant: "true", net-compliance: "true" }
    spec:
      containers:
        - name: frontend
          image: unagent/frontend:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: { app: frontend, role: load-balancer }
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: 80 }
