# Prod values from .env.prod (env entries merge by name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-orch
spec:
  template:
    spec:
      containers:
        - name: chat-orch
          env:
            - { name: CORS_ALLOW_ORIGIN, value: "https://unagent.site" }
            - { name: TELEGRAM_DEFAULT_TENANT_ID, value: "ce5ac1c5-9b16-486a-b091-5468d232a4b8" }
