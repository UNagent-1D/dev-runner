apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single namespace for the whole platform — enforced on every resource so the
# replica-set member DNS, Services, and consumers all agree (the namespace
# split-brain the design review flagged cannot recur).
namespace: unagent

resources:
  # base
  - base/namespace.yaml
  - base/configmap-platform.yaml
  - base/secret-platform.yaml
  # data stores
  - data/email-mongo.yaml
  - data/conversation-mongo.yaml
  - data/redis.yaml
  - data/rabbitmq.yaml
  - data/tenant-postgres.yaml
  - data/hospital-postgres.yaml
  # one-shot jobs
  - jobs/tenant-migrate.yaml
  - jobs/tenant-seed.yaml
  # applications
  - apps/chat-orch.yaml
  - apps/conversation-chat.yaml
  - apps/agent-runtime.yaml
  - apps/tenant.yaml
  - apps/hospital-mock.yaml
  - apps/compliance.yaml
  - apps/email-send.yaml
  - apps/user-auth.yaml
  - apps/grafana.yaml
  - apps/frontend.yaml

# Init SQL + migrations are sourced from the real repo files so they never drift
# from what docker-compose mounts. Stable names (no hash suffix) so the volume
# references in the StatefulSets/Jobs resolve.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tenant-postgres-init
    files:
      - 10_user_auth.sql=../scripts/data-stores/user-auth-init.sql
  - name: hospital-postgres-init
    files:
      - 01_schema.sql=../Hospital-MP/schema.sql
      - 02_seed.sql=../Hospital-MP/seed.sql
  - name: tenant-migrate-migrations
    files:
      - 000001_create_tenants.up.sql=../Tenant/migrations/global/000001_create_tenants.up.sql
      - 000001_create_tenants.down.sql=../Tenant/migrations/global/000001_create_tenants.down.sql
      - 000002_create_users.up.sql=../Tenant/migrations/global/000002_create_users.up.sql
      - 000002_create_users.down.sql=../Tenant/migrations/global/000002_create_users.down.sql
      - 000003_create_tool_registry.up.sql=../Tenant/migrations/global/000003_create_tool_registry.up.sql
      - 000003_create_tool_registry.down.sql=../Tenant/migrations/global/000003_create_tool_registry.down.sql
      - 000004_users_names.up.sql=../Tenant/migrations/global/000004_users_names.up.sql
      - 000004_users_names.down.sql=../Tenant/migrations/global/000004_users_names.down.sql
