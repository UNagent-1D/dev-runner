---
# ── public entrypoints (keyed by app: label, not zone) ──────────────────────
# These are the externally-reachable Services. The `from` is omitted so ingress
# is allowed from ANY source on the listed port — LoadBalancer / `minikube
# tunnel` / NodePort traffic arrives SNAT'd from the node, so source-based
# filtering is neither possible nor desired for a public entrypoint.
#
# frontend is in public_net; conversation-chat is NOT (it is orch_net+chat_db_net)
# but carries a k8s-only LoadBalancer (conversation-chat-lb, pattern #4) with no
# compose analog — hence an explicit app-keyed allow rather than a zone policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-frontend
  namespace: unagent
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-public-conversation-chat
  namespace: unagent
spec:
  podSelector:
    matchLabels: { app: conversation-chat }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8082 }
