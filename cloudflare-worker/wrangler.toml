# Cloudflare Worker — UNAgent gateway.
#
# This is the BOOTSTRAP TEMPLATE. The bootstrap script (scripts/bootstrap.sh)
# substitutes the {{PLACEHOLDERS}} below with values from your .env files +
# the Railway service hostnames it captures, then writes the result to
# `wrangler.toml` (gitignored).
#
# If you ever need to edit `wrangler.toml` by hand, mirror the change into
# THIS file so re-running the bootstrap doesn't blow it away.

name = "unagent-gateway"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = false

# Static SPA assets — Vite build output is mounted into the Worker so the
# same wrangler deploy uploads code AND assets in one shot.
[assets]
directory = "../FrontEnd/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# dev — bound to dev.<apex>. Worker proxies to the GKE dev gateway
# (unagent-dev namespace; in-cluster frontend nginx routes the paths).
# ---------------------------------------------------------------------------
[env.dev]
name = "unagent-gateway-dev"
routes = [{ pattern = "dev.unagent.site", custom_domain = true }]

[env.dev.vars]
BACKEND_ORCH       = "https://api-dev.unagent.site"
BACKEND_TENANT     = "https://api-dev.unagent.site"
BACKEND_CHAT       = "https://api-dev.unagent.site"
BACKEND_COMPLIANCE = "https://api-dev.unagent.site"
BACKEND_USER_AUTH  = "https://api-dev.unagent.site"

# ---------------------------------------------------------------------------
# prod — bound to <apex>. Worker proxies to the GKE prod gateway
# (unagent-prod namespace; in-cluster frontend nginx routes the paths).
# ---------------------------------------------------------------------------
[env.prod]
name = "unagent-gateway-prod"
routes = [{ pattern = "unagent.site", custom_domain = true }]

[env.prod.vars]
BACKEND_ORCH       = "https://api.unagent.site"
BACKEND_TENANT     = "https://api.unagent.site"
BACKEND_CHAT       = "https://api.unagent.site"
BACKEND_COMPLIANCE = "https://api.unagent.site"
BACKEND_USER_AUTH  = "https://api.unagent.site"
